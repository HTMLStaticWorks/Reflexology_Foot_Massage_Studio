<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon — Sole Harmony</title>
  <meta name="description" content="Sole Harmony is preparing something special. Subscribe to be the first to know when we launch our new wellness experience.">
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#5B7153">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <script src="assets/js/main.js" defer></script>
</head>
<body>

  <main class="coming-soon-page">
    <div class="zen-dots" style="opacity: 0.03; background-image: radial-gradient(circle, #FFFFFF 1px, transparent 1px);"></div>
    <div class="floating-shape floating-shape-1" style="opacity: 0.06;"></div>
    <div class="floating-shape floating-shape-2" style="opacity: 0.06;"></div>

    <div class="coming-soon-content">
      <a href="index.html" class="nav-logo" style="text-decoration: none;">
        <svg class="nav-logo-icon" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg" style="color: var(--clr-accent-light);"><circle cx="18" cy="18" r="16" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M18 6c-2 4-6 7-6 12a6 6 0 0 0 12 0c0-5-4-8-6-12z" fill="currentColor" opacity="0.25"/><path d="M18 10c-1.5 3-4 5.5-4 9a4 4 0 0 0 8 0c0-3.5-2.5-6-4-9z" fill="currentColor" opacity="0.5"/></svg>
        <span>Sole Harmony</span>
      </a>

      <h1>Something Beautiful<br>Is Coming</h1>
      <p>We're crafting a new wellness experience just for you. Subscribe below to be the first to know when we open our doors.</p>

      <!-- Countdown: set to 90 days from now -->
      <div class="countdown" data-countdown="2027-01-01T00:00:00">
        <div class="countdown-item">
          <div class="countdown-number" id="countDays">0</div>
          <span class="countdown-label">Days</span>
        </div>
        <div class="countdown-item">
          <div class="countdown-number" id="countHours">0</div>
          <span class="countdown-label">Hours</span>
        </div>
        <div class="countdown-item">
          <div class="countdown-number" id="countMins">0</div>
          <span class="countdown-label">Minutes</span>
        </div>
        <div class="countdown-item">
          <div class="countdown-number" id="countSecs">0</div>
          <span class="countdown-label">Seconds</span>
        </div>
      </div>

      <form class="coming-soon-form" id="comingSoonForm">
        <input class="form-input" type="email" placeholder="Enter your email address" required aria-label="Email address">
        <button type="submit" class="btn btn-accent">Notify Me</button>
        <div class="form-success-msg" style="color: #FFFFFF; background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.3);">Thank you! We'll notify you when we launch.</div>
      </form>
    </div>
  </main>

</body>
</html>
